<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>マイトロフィー</title><link rel="stylesheet" href="collection.css"></head><body><main>
<span class="eyebrow">EVERY MOMENT COUNTS</span><h1 id="greeting">あなたのトロフィー図鑑</h1><p class="muted" id="message">読み込んでいます…</p>
<div class="metrics"><article><span>コメント</span><strong id="comments">-</strong></article><article><span>総文字数</span><strong id="characters">-</strong></article><article><span>視聴時間</span><strong id="watch">-</strong></article><article><span>参加した配信</span><strong id="streams">-</strong></article></div>
<div id="collection" class="grid"></div>
<p class="muted small">視聴時間は、拡張を入れたPCのブラウザで見たライブ配信だけが対象です。コメントはスマホから書いても記録されます。</p>
</main><script src="collection.js"></script></body></html>
