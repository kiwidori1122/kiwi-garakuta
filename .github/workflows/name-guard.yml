name: Name guard

# push されたコミットに、許可していない名義や「出してはいけない言葉」がないかを検査する。
# 言葉の一覧はリポジトリのシークレット GUARD_DENY（カンマ区切り）に入れておく（公開されない）。
# 公開後の検知。通知の有無はGitHub側の通知設定による。公開前の拒否は各PCのフックが担う。
on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test inspection rules
        run: python tools/guard/test_guard.py
      - name: Check commits
        env:
          KIWI_GUARD_DENY: ${{ secrets.GUARD_DENY }}
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -z "$KIWI_GUARD_DENY" ]; then
            echo "::error::Private deny rules are required. Inspection was not completed."
            exit 1
          fi
          if [ "$EVENT" = "pull_request" ]; then
            sh tools/guard/check-range.sh "$PR_BASE..$PR_HEAD"
          elif [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            sh tools/guard/check-range.sh "$AFTER"
          else
            sh tools/guard/check-range.sh "$BEFORE..$AFTER"
          fi
